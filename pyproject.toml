[project]
name = "cy-performance"
version = "0.0.1"
description = "Cycling performance analysis + adaptive training plans published to intervals.icu, fed by Strava and intervals.icu data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "polars>=1.5",
    "pandas>=2.2",
    "numpy>=2.0",
    "pyarrow>=17",
    "scipy>=1.14",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "typer>=0.12",
    "structlog>=24.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
serve = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "apscheduler>=3.10"]
llm = ["anthropic>=0.40"]

[project.scripts]
cyp = "cyp.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "poethepoet>=0.48.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyp"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "BLE", "D"]
ignore = ["D100", "D104", "D105", "D106", "D107", "D203", "D213"]
pydocstyle.convention = "google"
allowed-confusables = ["，", "：", "；", "（", "）", "／", "–", "−", "×", "′"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"src/cyp/**/__init__.py" = ["E501"]
"src/cyp/store/migrations/versions/*" = ["D", "E501"]
"src/cyp/store/models.py" = ["D101"]

[tool.poe.tasks]
lint = { cmd = "ruff check .", help = "Lint (ruff)" }
fmt-check = { cmd = "ruff format --check .", help = "Formatting check" }
fmt = { shell = "ruff format . && ruff check --fix .", help = "Format + autofix" }
typecheck = { cmd = "mypy src", help = "mypy strict" }
test = { cmd = "pytest -q", help = "Test suite (no network, tmp data dirs)" }
web = { cmd = "npm --prefix web run check", help = "Web UI: API types current, tsc strict, build" }
check = { sequence = ["lint", "fmt-check", "typecheck", "test", "web"], help = "THE gate: CI runs exactly this" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
packages = ["cyp"]
mypy_path = "src"
strict = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]
