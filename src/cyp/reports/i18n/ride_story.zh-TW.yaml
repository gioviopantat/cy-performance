# Strava RIDE.LOG copy (reports/ride_story.py, spec casual-and-strava §C). Public and casual:
# light suggestions for next time, never a diary of the ride (Roger, 2026-10-17); no verdicts,
# no plan, no tomorrow, no model jargon. Place names always in 「」 and only from
# OSM facts. Variants rotate deterministically by activity id.

next_spot:
  - "下次可以去「{spot}」晃晃，{why}，離這次折返點約 {spot_km} 公里 📍"
  - "口袋名單再加一：「{spot}」，{why}，離折返點約 {spot_km} 公里"
spot_why:
  viewpoint: "聽說風景不錯"
  peak: "還沒去過的山頭"
  cafe: "剛好可以坐下來喝一杯"
  attraction: "順路可以停下來看看"

stop:
  - "「{stop}」可以列入補給口袋名單 ☕"
  - "下次經過「{stop}」，再停一下也不錯"

#: The report's climbs carry a generated label (distance · grade), not a name: never quoted.
climb_board:
  - "那段常爬的坡，下次試試前半段收著騎，後半段再放 ⛰️"
  - "那段常爬的坡，下次挑涼一點的時段再來，應該會更順 ⛰️"
climb_place:
  - "「{peak}」那段坡不錯，有空可以再去 ⛰️"

weather:
  hot: "{temp}°C 的天，下次早點出門，水多帶一瓶 🧴"
  warm: "這種天氣很好騎，下次可以騎遠一點"
  cool: "涼涼的天最舒服，趁現在多騎幾趟"
  cold: "冷天出門，風衣跟手套記得帶 🧥"

season:
  1: "一月很冷，出門前先暖身，終點來碗熱湯"
  2: "二月春寒，多帶一件薄外套"
  3: "三月花開，挑條有花的路騎"
  4: "四月雨多，晴天記得把握"
  5: "五月開始熱了，早點出門比較舒服"
  6: "六月午後雷陣雨多，早上騎最穩"
  7: "七月太熱，清晨出門最划算"
  8: "八月太陽很烈，找有樹蔭的路線"
  9: "九月開始轉涼，可以排遠一點的路線"
  10: "十月很好騎，週末找條山路吧"
  11: "十一月秋高氣爽，多出門踩踩"
  12: "十二月冷，騎完喝杯熱飲剛好"

tip:
  - "下次試試沒騎過的小路，迷路也是一種樂趣"
  - "出門前捏一下輪胎，省得半路補胎"
  - "鏈條好像該上油了，順手保養一下"
  - "回程換條沒走過的路，換換口味"
  - "出門前看一下風向，逆風去、順風回最爽"
  - "補給點先想好，騎起來比較安心"
  - "下次帶上相機，路上的風景值得拍"
  - "累了就停下來，騎車不用跟誰比"

#: Acrostic heads (4 characters each) per content type; the last 10 used are skipped.
heads:
  climb: ["坡陡心定", "登高望遠", "汗灑山徑", "步步登高", "峰迴路轉", "千階在望", "攀雲而上", "山風入懷"]
  stop: ["杯中有茶", "停車小憩", "一盞清涼", "茶香半日", "歇腳樹下", "閒坐街角", "涼飲解渴", "偷閒片刻"]
  next_spot: ["他日再訪", "下回相約", "前方有景", "且待來日", "尋幽訪勝", "來日方長", "遠方在招", "約定山水"]
  weather: ["日暖風輕", "晴空萬里", "秋陽正好", "微風拂面", "雲淡天高", "晚風送涼", "細雨沾衣", "烈日當空"]
  tip: ["隨心而行", "輪轉天涯", "閒騎自在", "清風作伴", "隨遇而安", "一路好風", "自在逍遙", "且騎且行"]
  season: ["秋意漸濃", "四季輪轉", "時節正好", "秋風送爽", "歲月如輪", "金風玉露", "寒來暑往", "流光騎過"]

footer: "#cyperformance"

#: Validation word lists (reports/ride_story.validate).
validation:
  #: Words that read as a place; outside a facts place they mean an invented one.
  place_words: ["咖啡", "茶", "寺", "宮", "廟", "公園", "步道", "觀景台"]
  #: Never in a RIDE.LOG (Roger: 甜蜜點 not 甜點; no 三八 / 幹).
  forbidden: ["甜點", "三八", "幹"]
