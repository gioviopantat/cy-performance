id: z2_hilly_180
version: 1
name: "Hilly Endurance 180 min"
name_zh: "多坡有氧 180 分"
purpose_zh: "三小時多坡 Z2，長騎版本。"
intent: endurance
phases: [base, build, threshold]
slot_roles: [long_ride]
requires_power: false
indoor_ok: false
outdoor_ok: true
params: {}
steps:
  - {cue: Warmup, kind: ramp, duration: 15m, lo: 50, hi: 65}
  - {cue: Rolling, kind: steady, duration: 150m, lo: 60, hi: 78, cadence: "80-95rpm"}
  - {cue: Cooldown, kind: steady, duration: 15m, lo: 50, hi: 55}
outdoor_rendering:
  note: "A hilly route; climbs at or below 78 %, eat 60-90 g carbs/h."
  note_zh: "多坡路線；上坡不超過 78 %，每小時補 60–90 g 碳水。"
  widen_pct: 3
  rests_as_freeride: false
  ramps_as_range: true
hr_fallback:
  note_zh: "心率 69–86 % LTHR；最後一小時心率漂移時降速。"
  steps:
    - {cue: Warmup, kind: ramp, duration: 15m, lo: 60, hi: 72}
    - {cue: Rolling, kind: steady, duration: 150m, lo: 69, hi: 86, cadence: "80-95rpm"}
    - {cue: Cooldown, kind: steady, duration: 15m, lo: 60, hi: 68}
tss_model: closed_form
explain_zh: "三小時多坡有氧是耐力型目標的長騎主力：累積爬升、補給練習與時間在車上的耐受度，強度仍在 Z2，不會影響隔週的強度課。"
